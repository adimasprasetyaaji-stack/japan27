<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>



<style>

:root{
  --bg:#eceff4; --surface:#ffffff; --ink:#18212f; --muted:#5d6878; --line:#d6dbe4; --soft:#f4f6f9;
  --torii:#c8412b; --torii-ink:#ffffff; --indigo:#253a66; --rail:#b9c2d0;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#9a6a00; --warn-soft:#fbf1d3; --bad:#b3261e; --bad-soft:#f8dedb;
  --info-soft:#e0e9f7; --lav-soft:#ebe6f5; --grey-soft:#e6e8ec;
  --shadow:0 1px 2px rgba(24,33,47,.06),0 4px 14px rgba(24,33,47,.05);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Times New Roman",serif;
  --body:"Zen Kaku Gothic New",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f141c; --surface:#18202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2a3442; --soft:#1e2733;
    --torii:#e2603f; --torii-ink:#150a07; --indigo:#8fa8dc; --rail:#3a4657;
    --ok:#6fcf97; --ok-soft:#173326; --warn:#e3b341; --warn-soft:#3a2f12; --bad:#ff8a80; --bad-soft:#3d1c1a;
    --info-soft:#1c2c45; --lav-soft:#2a2440; --grey-soft:#262d38; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141c; --surface:#18202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2a3442; --soft:#1e2733;
  --torii:#e2603f; --torii-ink:#150a07; --indigo:#8fa8dc; --rail:#3a4657;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#e3b341; --warn-soft:#3a2f12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --info-soft:#1c2c45; --lav-soft:#2a2440; --grey-soft:#262d38; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--torii);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:14px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;text-wrap:balance}
.brand .route{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.countdown{margin-left:auto;font-size:12px;color:var(--muted)}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;display:grid;justify-items:center;min-width:54px;padding:6px 8px 7px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.day-chip b{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em}
.day-chip span{font-size:11px;color:var(--muted)}
.day-chip i{font-style:normal;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day-chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.day-chip[aria-pressed="true"] span,.day-chip[aria-pressed="true"] i{color:var(--surface);opacity:.85}
.day-chip.is-today{box-shadow:inset 0 -3px 0 var(--torii)}

main{padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 90px);max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:10px 2px 12px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--torii);font-weight:700}

.dayhead{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:8px}
.dayhead .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--torii)}
.dayhead h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.3;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13px;background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--indigo);border-radius:9px;padding:6px 11px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;line-height:1.3}
.btn.primary{background:var(--torii);border-color:var(--torii);color:var(--torii-ink);font-weight:700}
.btn.ghost{border-color:transparent;padding-inline:6px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:12px 2px 6px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);margin:0}

/* garis rel: jadwal sebagai stasiun-stasiun */
.line{position:relative;margin-top:6px;display:grid;gap:10px}
.line::before{content:"";position:absolute;left:61px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--rail)}
.stop{display:grid;grid-template-columns:50px 24px 1fr;gap:0 0;align-items:start}
.stop .time{font-family:var(--mono);font-size:13px;font-weight:600;padding-top:12px;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;line-height:1.25}
.stop .time small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.stop .dot{justify-self:center;margin-top:15px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--indigo);position:relative;z-index:1}
.stop.done .dot{background:var(--ok);border-color:var(--ok)}
.stop.now .dot{background:var(--torii);border-color:var(--torii);box-shadow:0 0 0 5px color-mix(in srgb,var(--torii) 22%,transparent)}
.stop.off .dot{border-color:var(--rail);border-style:dashed}
.card{background:var(--surface);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);min-width:0}
.stop.off .card{opacity:.6}
.stop.off h3{text-decoration:line-through}
.stop.now .card{outline:2px solid var(--torii)}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.stop.done h3{color:var(--ok)}
.desc{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tag.cat{color:var(--ink)}
.st{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:5px;padding:1px 6px;white-space:nowrap}
.st-KONFLIK{background:var(--bad-soft);color:var(--bad)} .st-CEK{background:var(--warn-soft);color:var(--warn)}
.st-REVISI{background:var(--info-soft);color:var(--indigo)} .st-BARU{background:var(--ok-soft);color:var(--ok)}
.st-DIPINDAH{background:var(--lav-soft);color:var(--indigo)} .st-USUL_HAPUS,.st-OPSIONAL,.st-BATAL{background:var(--grey-soft);color:var(--muted)}
.st-FINAL,.st-BOOKED,.st-PAID,.st-DECIDED,.st-CLOSED,.st-SELESAI{background:var(--ok-soft);color:var(--ok)}
.st-BELUM,.st-BELUM_BOOKING,.st-OPEN{background:var(--warn-soft);color:var(--warn)} .st-PROSES{background:var(--info-soft);color:var(--indigo)} .st-NA{background:var(--grey-soft);color:var(--muted)}
.acts{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.cost{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
details{margin-top:8px;font-size:13px}
summary{color:var(--indigo);cursor:pointer}
details p{margin:6px 0 0;white-space:pre-wrap}
.mynote{margin-top:7px;font-size:13px;background:var(--soft);border-left:3px solid var(--torii);border-radius:6px;padding:6px 9px;white-space:pre-wrap}

.sec{display:grid;gap:10px;margin-top:6px}
.sec>h2{margin:10px 2px 0;font-family:var(--display);font-size:18px;font-weight:800}
.progress{height:8px;border-radius:99px;background:var(--grey-soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px}
.kv .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv .tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.big{font-family:var(--display);font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:12px}
.bar .lab{font-family:var(--mono);color:var(--muted)}
.bar .track{height:9px;border-radius:5px;background:var(--grey-soft);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--indigo)}
.bar .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.prio{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px}
.P1{background:var(--bad-soft);color:var(--bad)} .P2{background:var(--warn-soft);color:var(--warn)} .P3{background:var(--info-soft);color:var(--indigo)} .P4{background:var(--grey-soft);color:var(--muted)}
.small{font-size:12.5px} .muted{color:var(--muted)}
.banner{font-size:12.5px;color:var(--muted);padding:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:28px 0}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.panel{background:var(--surface);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:88vh;overflow:auto}
.panel h3{margin:0 0 6px;font-family:var(--display);font-size:18px}
.field{display:grid;gap:4px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font-size:16px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink)}
.field textarea{min-height:84px;resize:vertical}
.field.inline{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.field.inline input{width:22px;height:22px;flex:none;padding:0;accent-color:var(--torii)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}


/* ===== token tambahan: visual, peta, status ===== */
:root{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s0:#9aa3af;
  --sea:#dde7f0; --land:#ffffff; --nb:#e9e6df; --coast:#8e99ab; --route:#c8412b; --pin-ink:#ffffff;
  --crit:#d03b3b; --serious:#d9622b; --caution:#b98100; --good:#1d8a3a;
  --day:#f7e6ad; --night:#e4e8ef;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#1f9a1f; --s0:#6b7584;
    --sea:#0c1622; --land:#222c39; --nb:#171e27; --coast:#4b5a6e; --route:#ff7a57; --pin-ink:#0f141c;
    --crit:#ff7b72; --serious:#f0884f; --caution:#e3b341; --good:#6fcf97;
    --day:#3a3320; --night:#1b222c;
  }
}
:root[data-theme="dark"]{
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#1f9a1f; --s0:#6b7584;
  --sea:#0c1622; --land:#222c39; --nb:#171e27; --coast:#4b5a6e; --route:#ff7a57; --pin-ink:#0f141c;
  --crit:#ff7b72; --serious:#f0884f; --caution:#e3b341; --good:#6fcf97;
  --day:#3a3320; --night:#1b222c;
}
[hidden]{display:none!important}
.r-kanto{--rc:var(--s1)} .r-kansai{--rc:var(--s2)} .r-hokkaido{--rc:var(--s3)} .r-chubu{--rc:var(--s4)} .r-id{--rc:var(--s0)}

.tabbar{grid-template-columns:repeat(5,1fr)}
.tabbar button{font-size:11.5px}
.syncbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 0 0}
.syncbar .led{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.syncbar.off .led{background:var(--caution)} .syncbar.err .led{background:var(--crit)}
.syncbar button{margin-left:auto}
.loading{padding:48px 0;text-align:center;color:var(--muted)}

/* ===== ringkasan ===== */
.hero{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--torii)}
.heroNum{font-family:var(--body);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.01em}
.heroNum small{font-size:18px;font-weight:500;color:var(--muted);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.stats div{display:grid;gap:1px;min-width:0}
.stats b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11.5px;color:var(--muted);line-height:1.3}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px}}
.today{border-left:4px solid var(--torii)}

.sec>h2 .pct{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);margin-left:6px}
.sec>h2{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sec>h2 small{font-family:var(--body);font-size:12.5px;font-weight:400;color:var(--muted)}
.meters{display:grid;gap:12px}
.meter{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:5px 10px;cursor:pointer;width:100%}
.meter:focus-visible{outline:2px solid var(--torii);outline-offset:3px;border-radius:6px}
.meter .ml{font-size:13.5px}
.meter .mv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .mt{grid-column:1/-1;height:10px;border-radius:99px;background:color-mix(in srgb,var(--lv) 18%,var(--surface));overflow:hidden}
.meter .mt i{display:block;height:100%;border-radius:99px;background:var(--lv);min-width:0}
.lv-crit{--lv:var(--crit)} .lv-warn{--lv:var(--caution)} .lv-good{--lv:var(--good)}

.ins{background:var(--surface);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow);display:grid;gap:6px;border-left:4px solid var(--sv)}
.ins h3{margin:0;font-size:15px;line-height:1.35}
.ins p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.ins .body{color:var(--muted)}
.ins .rec{background:var(--soft);border-radius:8px;padding:7px 9px}
.ins .acts{margin-top:2px}
.sev{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sv)}
.sev svg{width:13px;height:13px;fill:currentColor}
.sv1{--sv:var(--crit)} .sv2{--sv:var(--serious)} .sv3{--sv:var(--caution)} .sv4{--sv:var(--indigo)}
.sevsum{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sevsum b{color:var(--ink)}

/* diagram blok rute */
.flowcard{margin:0;background:var(--surface);border-radius:14px;padding:14px 12px 12px;box-shadow:var(--shadow)}
.flow{list-style:none;margin:0;padding:0;display:grid}
.flow li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.flow .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.flow .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.flow li:first-child .rail::before{top:14px} .flow li:last-child .rail::before{bottom:calc(100% - 14px)}
.flow .home .pt{position:relative;margin-top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.flow .home .lbl{padding:4px 0 10px;font-size:13px}
.flow .home .lbl b{font-size:14px}
.flow .conn .ico{position:relative;margin:6px 0;width:28px;height:28px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--indigo)}
.flow .conn .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.flow .conn .lbl{padding:8px 0;display:grid;gap:4px;font-size:12.5px}
.flow .conn .bk{all:unset;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--ink)}
.flow .conn .bk:focus-visible{outline:2px solid var(--torii);border-radius:4px}
.flow .conn .bk .when{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.flow .conn .none{color:var(--muted);font-style:italic}
.flow .stay .pt{position:relative;margin-top:12px;width:18px;height:18px;border-radius:5px;background:var(--rc);box-shadow:0 0 0 3px var(--surface)}
.blk{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:5px;margin:4px 0 6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--rc);background:var(--surface);width:100%}
.blk:focus-visible{outline:2px solid var(--torii);outline-offset:2px}
.blk .bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.blk .bh b{font-family:var(--display);font-size:18px;font-weight:800}
.blk .bh .n{font-size:12.5px;color:var(--muted)}
.blk .sub{font-size:12.5px;color:var(--muted)}
.blk .hs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.trips{display:flex;flex-wrap:wrap;gap:5px}
.trip{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--soft);border:1px dashed var(--line);color:var(--ink)}
.trip b{font-weight:600}
.trip.far{border-color:var(--serious);color:var(--serious)}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}

/* donut */
.donutwrap{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{max-width:220px;justify-self:center}}
.donut{width:100%;height:auto;display:block}
.donut path{stroke:var(--surface);stroke-width:2;cursor:pointer;transition:opacity .15s}
.donut.hl path:not(.on){opacity:.28}
.donut .c1{font:700 17px var(--body);fill:var(--ink)} .donut .c2{font:500 11px var(--body);fill:var(--muted)}
.legend{width:100%;border-collapse:collapse;font-size:13px}
.legend td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.legend tr:last-child td{border-bottom:0}
.legend .sw{width:20px;padding-right:6px} .legend .sw i{display:block;width:10px;height:10px;border-radius:3px}
.legend .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.legend .p{text-align:right;color:var(--muted);font-size:12px;width:42px;font-variant-numeric:tabular-nums}
.legend tr{cursor:pointer} .legend tr.on td{font-weight:700}
.legend tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}

/* beban per hari (gantt 24 jam) */
.load{display:grid;gap:4px}
.load .axis,.lrow{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center}
.load .axis .sc{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.load .axis .sc span{position:absolute;transform:translateX(-50%)} .load .axis .sc span:first-child{transform:none} .load .axis .sc span:last-child{transform:translateX(-100%)}
.lrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;cursor:pointer;width:100%;padding:2px 0;border-radius:6px}
.lrow:hover{background:var(--soft)} .lrow:focus-visible{outline:2px solid var(--torii)}
.lrow .lab{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.lrow .tr{position:relative;height:16px;border-radius:4px;background:var(--night);overflow:hidden}
.lrow .tr .dl{position:absolute;top:0;bottom:0;background:var(--day)}
.lrow .tr .bar{position:absolute;top:4px;height:8px;border-radius:4px;background:var(--indigo)}
.lrow.heavy .tr .bar{background:var(--serious)}
.lrow .n{font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow.heavy .n{color:var(--serious);font-weight:700}
.loadkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.loadkey i{display:inline-block;width:14px;height:8px;border-radius:3px;vertical-align:middle;margin-right:5px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--grey-soft);border-radius:10px;padding:3px;gap:3px;margin-top:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* ===== peta ===== */
.mapctl{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.mapctl::-webkit-scrollbar{display:none}
.mapctl button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.mapctl button i{width:9px;height:9px;border-radius:50%;background:var(--rc)}
.mapctl button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.mapwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--sea)}
svg.map{display:block;width:100%;height:min(66vh,118vw);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg.map:active{cursor:grabbing}
.map .sea{fill:var(--sea)} .map .nb{fill:var(--nb)} .map .land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map .ln{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .ln.route{stroke:var(--route);stroke-width:2.5}
.map .ln.air{stroke-dasharray:6 5}
.map .ln.bb{stroke:var(--ink);stroke-opacity:.55;stroke-width:1.6}
.map .ghost{fill:var(--muted);opacity:.35}
.map .dot{stroke:var(--surface);vector-effect:non-scaling-stroke;stroke-width:1.5;fill:var(--rc)}
.map .cl{fill:var(--rc);stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}
.map .cl-t{fill:var(--pin-ink);font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .pin{fill:var(--route);stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}
.map .pin.sel{fill:var(--ink)}
.map .pin-t{fill:var(--pin-ink);font-family:var(--mono);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .htl{fill:var(--surface);stroke:var(--rc,var(--indigo));stroke-width:2.5;vector-effect:non-scaling-stroke}
.map .htl-t{fill:var(--ink);font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .lbl{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.map .lbl.sm{font-weight:500;fill:var(--muted)}
.map .hit{fill:transparent;cursor:pointer}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.maphint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 7px;border-radius:6px;pointer-events:none}
.mapkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 2px 0}
.mapkey span{display:inline-flex;align-items:center;gap:6px}
.mapkey i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rc)}
.mapkey i.sq{border-radius:3px;background:var(--surface);border:2px solid var(--indigo)}
.mapkey i.ln{width:18px;height:0;border-radius:0;border-top:2.5px solid var(--route);background:none}
.mapkey i.ln.air{border-top-style:dashed}
.pininfo{margin-top:10px}
.pininfo .card{border-left:4px solid var(--route)}
.pininfo .src{font-size:11.5px;color:var(--muted)}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stops button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:28px 44px 1fr auto;gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow)}
.stops button:focus-visible{outline:2px solid var(--torii)}
.stops button[aria-pressed="true"]{outline:2px solid var(--route)}
.stops .no{width:24px;height:24px;border-radius:50%;background:var(--route);color:var(--pin-ink);font-family:var(--mono);font-size:11px;font-weight:600;display:grid;place-items:center}
.stops .no.h{background:var(--surface);color:var(--ink);border:2px solid var(--indigo);border-radius:6px}
.stops .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stops .ti{font-size:13.5px;overflow-wrap:anywhere}
.stops .km{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.daysum{display:grid;gap:6px}
.daysum button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);width:100%}
.daysum .lab{font-family:var(--mono);font-size:12px;color:var(--muted)}
.daysum .t{font-size:13.5px;overflow-wrap:anywhere}
.daysum .k{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.warnline{font-size:12.5px;color:var(--muted);margin-top:8px}
.help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}

var SEV = {1:['Kritis','crit'], 2:['Penting','crit'], 3:['Perhatian','info'], 4:['Info','info']};

/* ================= RINGKASAN ================= */
function lvl(p){ return p < 0.34 ? 'crit' : p < 0.67 ? 'warn' : 'good'; }
function tripRoutes(D){ return D.days.filter(function(d){ var n = num(d.day); return n >= 1 && n <= 16; }).map(function(d){ return C.dayRoute(D, num(d.day)); }).filter(Boolean); }
function isHeavy(r){ return r.hours >= 14.5 || r.groundKm >= 250; }

function vRingkasan(D){
  var today = todayISO(), start = C.setting(D,'trip_start','2027-01-25'), end = C.setting(D,'trip_end','2027-02-11');
  var toGo = C.daysBetween(today, start), p = C.pax(D), b = C.budget(D), rd = C.readiness(D), ins = C.insights(D, today);
  var routes = tripRoutes(D), ground = routes.reduce(function(s, r){ return s + r.groundKm; }, 0);

    + '<div><b>±' + kmTxt(ground) + ' km</b><span>jalan darat (garis lurus)</span></div><div><b>' + yenShort(b.total) + '</b><span>estimasi total</span></div></div></section>';
  if (during && dayNow) h += '<section class="sec"><div class="card today"><b>Hari ini:</b> ' + esc(dayNow.title) + '<div class="acts"><button class="btn primary" data-act="goday" data-id="' + esc(dayNow.day) + '">Buka jadwal hari ini</button><button class="btn" data-act="mapday" data-id="' + esc(dayNow.day) + '">Lihat di peta</button></div></div></section>';

  var show = S.allIns ? ins : ins.slice(0, 4);
  show.forEach(function(it, i){
    h += '<article class="ins sv' + it.sev + '"><span class="sev">' + ICON[SEV[it.sev][1]] + SEV[it.sev][0] + '</span><h3>' + esc(it.title) + '</h3>'

/* ---- donut budget ---- */
var CAT_COLOR = {hotel:'s1', flight_id:'s2', transport:'s3', fun:'s4', food:'s5', other:'s6', cont:'s0'};
function arcPath(cx, cy, R, r, a0, a1){
  if (a1 - a0 >= Math.PI * 2 - 1e-4) a1 = a0 + Math.PI * 2 - 1e-4;
  var L = (a1 - a0) > Math.PI ? 1 : 0;
  function p(rad, a){ return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2); }
  return 'M' + p(R, a0) + 'A' + R + ' ' + R + ' 0 ' + L + ' 1 ' + p(R, a1) + 'L' + p(r, a1) + 'A' + r + ' ' + r + ' 0 ' + L + ' 0 ' + p(r, a0) + 'Z';
}
function donutBlock(b, id){
  var cats = b.cats, tot = b.total || 1, a = -Math.PI / 2;
  var svg = '<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Komposisi estimasi biaya total ' + esc(yen(b.total)) + '">';
  cats.forEach(function(c, i){
    if (c.v <= 0) return;
    var a1 = a + Math.PI * 2 * c.v / tot;
    svg += '<path data-slice="' + i + '" tabindex="0" style="fill:var(--' + CAT_COLOR[c.id] + ')" d="' + arcPath(100, 100, 94, 60, a, a1) + '"><title>' + esc(c.label) + ': ' + esc(yen(c.v)) + ' (' + Math.round(c.v * 100 / tot) + '%)</title></path>';
    a = a1;
  });
  svg += '<text class="c1" x="100" y="97" text-anchor="middle">' + esc(yenShort(b.total)) + '</text><text class="c2" x="100" y="116" text-anchor="middle">estimasi total</text></svg>';
  var tb = '<table class="legend"><tbody>';
  cats.forEach(function(c, i){
    tb += '<tr data-slice="' + i + '"><td class="sw"><i style="background:var(--' + CAT_COLOR[c.id] + ')"></i></td><td>' + esc(c.label) + '</td><td class="v">' + esc(yen(c.v)) + '</td><td class="p">' + Math.round(c.v * 100 / tot) + '%</td></tr>';
  });
  tb += '</tbody><tfoot><tr><td></td><td>Total</td><td class="v">' + esc(yen(b.total)) + '</td><td class="p">100%</td></tr></tfoot></table>';
  var over = b.total - b.target;
  var note = b.target ? '<p class="warnline">Target ' + esc(yen(b.target)) + ' → ' + (over > 0 ? '<b style="color:var(--crit)">lebih ' + esc(yen(over)) + ' (' + Math.round(over * 100 / b.target) + '%)</b>' : '<b style="color:var(--good)">sisa ' + esc(yen(-over)) + '</b>') + '. Tiket pesawat Indonesia & hotel memakai kurs Rp' + C.fx({settings:T('settings')}).toLocaleString('id-ID') + '/¥.</p>' : '';
  return '<div class="donutwrap" data-donut="' + id + '">' + svg + tb + '</div>' + note;
}
function hlSlice(wrap, i){
  if (!wrap) return;
  var svg = wrap.querySelector('svg'), b = C.budget(DB()), c = b.cats[i];
  svg.classList.toggle('hl', i >= 0);
  Array.prototype.forEach.call(wrap.querySelectorAll('[data-slice]'), function(el){ el.classList.toggle('on', Number(el.getAttribute('data-slice')) === i); });

/* ---- beban per hari (rentang jam vs terang hari) ---- */
function loadChart(D, routes){

  });

}

/* ================= PETA ================= */
var Y0 = merc(M.latTop);
function merc(l){ return Math.log(Math.tan(Math.PI / 4 + l * Math.PI / 360)) * 180 / Math.PI; }
function P(lat, lng){ return {x:(lng - M.lon0) * M.k, y:(Y0 - merc(lat)) * M.k}; }
var MV = {vb:null, key:'', model:null, raf:0};

function mapKey(){ return (S.mapAll ? 'all' : 'd' + S.day) + '|' + (S.region || ''); }
function mapModel(D){
  var m = {all:S.mapAll, dots:[], hotels:[], bb:[], labels:[], pins:[], segs:[], ghosts:[], route:null, unloc:[]};
  var lg = C.legs(D), lastStay = null, lastMove = null, hseen = {}, cityN = {};
  lg.forEach(function(l){
    if (l.kind === 'move') { lastMove = l; return; }
    if (l.kind !== 'stay' || !l.loc || l.loc.region === 'id') return;
    var p = P(l.loc.lat, l.loc.lng), k = Math.round(p.x) + ',' + Math.round(p.y);
    if (!hseen[k]) { hseen[k] = {x:p.x, y:p.y, region:l.loc.region, legs:[]}; m.hotels.push(hseen[k]); }
    hseen[k].legs.push(l);
    cityN[l.city] = cityN[l.city] || {n:0, x:p.x, y:p.y, region:l.loc.region}; cityN[l.city].n += num(l.hotel.nights);
    if (lastStay) {
      var a = P(lastStay.loc.lat, lastStay.loc.lng), air = lastMove && lastMove.bookings.some(function(b){ return /FLIGHT/.test(b.type); });
      m.bb.push({a:a, b:p, air:!!air});
    }
    lastStay = l; lastMove = null;
  });
  Object.keys(cityN).forEach(function(c){ var v = cityN[c]; m.labels.push({x:v.x, y:v.y, t:c + ' · ' + v.n + ' mlm', region:v.region}); });
  D.itinerary.forEach(function(it){
    if (!bool(it.is_active)) return;
    var loc = C.locate(it, D); if (!loc || loc.region === 'id' || loc.hotel) return;
    var p = P(loc.lat, loc.lng); m.dots.push({x:p.x, y:p.y, region:loc.region, it:it, loc:loc});
  });
  if (!S.mapAll) {
    var r = C.dayRoute(D, S.day); m.route = r;
    if (r) {
      var groups = {}, n = 0;
      r.seq.forEach(function(s){
        var p = P(s.loc.lat, s.loc.lng);
        if (s.hotel) { m.pins.push({x:p.x, y:p.y, hotel:true, loc:s.loc, items:[], nums:[]}); return; }
        n++; s.no = n;
        var k = s.loc.lat.toFixed(4) + ',' + s.loc.lng.toFixed(4);
        if (!groups[k]) { groups[k] = {x:p.x, y:p.y, loc:s.loc, items:[], nums:[]}; m.pins.push(groups[k]); }
        groups[k].items.push(s.item); groups[k].nums.push(n);
      });
      r.segs.forEach(function(sg){ m.segs.push({a:P(sg.a.lat, sg.a.lng), b:P(sg.b.lat, sg.b.lng), air:sg.air, km:sg.km}); });
      m.unloc = r.unlocated;
      var dayIds = {}; r.stops.forEach(function(s){ dayIds[s.item.item_id] = 1; });
      m.ghosts = m.dots.filter(function(d){ return !dayIds[d.it.item_id]; });
    }
  }
  return m;
}
function fitPoints(pts, svg){
  var box = svg.getBoundingClientRect(), ew = box.width || 358, eh = box.height || 420;
  if (!pts.length) return {x:0, y:0, w:M.w, h:M.w * eh / ew};
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(function(p){ x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
  var w = Math.max(x1 - x0, 4), h = Math.max(y1 - y0, 4), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  // ruang layar yang dipakai titik: sisakan kiri 24px, kanan 64px (tombol zoom), atas 24px, bawah 36px
  var aw = ew - 88, ah = eh - 60, sc = Math.min(aw / (w * 1.12), ah / (h * 1.12));
  var W = ew / sc, H = eh / sc;
  return {x:cx - (24 + aw / 2) / sc, y:cy - (24 + ah / 2) / sc, w:W, h:H};
}
function currentFitPoints(m){
  if (S.region) return m.dots.concat(m.hotels).filter(function(p){ return p.region === S.region; });
  if (!m.all && m.pins.length) return m.pins;
  return m.dots.concat(m.hotels);
}
function vPeta(D){
  var m = mapModel(D); MV.model = m;
  var regs = {}; m.dots.concat(m.hotels).forEach(function(p){ regs[p.region] = 1; });
  var h = '<div class="mapctl" aria-label="Zoom ke wilayah"><button data-act="region" data-id="" aria-pressed="' + !S.region + '">' + (S.mapAll ? 'Seluruh rute' : 'Hari ' + S.day) + '</button>';

      {name:'hotel_name', label:'Nama hotel', value:r.hotel_name}, {name:'address', label:'Alamat', type:'textarea', value:r.address}, {name:'phone', label:'Telepon', type:'tel', value:r.phone},
      {name:'booking_ref', label:'Kode booking', value:r.booking_ref}, {name:'rate_per_night', label:'Tarif per malam (' + r.currency + ')', type:'number', value:r.rate_per_night},
      {name:'status', label:'Status', type:'select', options:['BELUM_BOOKING','BOOKED','PAID','BATAL'], value:r.status}, {name:'note', label:'Catatan', type:'textarea', value:r.note},
      {name:'coord', label:'Koordinat / link Google Maps hotel (opsional)', value:coordValue(r), ph:'35.7118, 139.7966'}],
      function(v){ var lp = locPatch(r, v); if (!lp) return false; delete v.coord; save('hotels', id, Object.assign(v, lp)); if (HAS_GAS && !lp.lat && (v.hotel_name || v.address)) setTimeout(function(){ geoLoop(0); }, 1500); }, esc(LOC_HELP)); },
  booking:function(id){ var r = find('bookings', id); openSheet(r.title, [
      {name:'provider', label:'Maskapai / operator', value:r.provider}, {name:'ref_no', label:'No. penerbangan / kode booking', value:r.ref_no},
      {name:'dep_time', label:'Jam berangkat / mulai', type:'time', value:r.dep_time}, {name:'arr_time', label:'Jam tiba / selesai', type:'time', value:r.arr_time},
      {name:'status', label:'Status', type:'select', options:['BELUM','CEK','KONFLIK','BOOKED','PAID','BATAL'], value:r.status}, {name:'note', label:'Catatan', type:'textarea', value:r.note}], function(v){ save('bookings', id, v); }); },
  finding:function(id){ var r = find('findings', id); openSheet(r.finding_id + ' · ' + r.category, [
      {name:'status', label:'Status', type:'select', options:['OPEN','DECIDED','CLOSED'], value:r.status}, {name:'decision', label:'Keputusan keluarga', type:'textarea', value:r.decision}], function(v){ save('findings', id, v); }); },
  other:function(id){ var r = find('budget_other', id); openSheet(r.item, [{name:'amount', label:'Jumlah (' + r.currency + ')', type:'number', value:r.amount}, {name:'note', label:'Catatan', type:'textarea', value:r.note}], function(v){ save('budget_other', id, v); }); },
  prio:function(id){ S.prio = id; render(); },
  sub:function(id){ S.sub = id; render(); },
  gosub:function(id){ S.tab = 'persiapan'; S.sub = id; render(); window.scrollTo(0, 0); },
  goday:function(id){ S.tab = 'jadwal'; S.day = num(id); render(); window.scrollTo(0, 0); },
  mapday:function(id){ S.tab = 'peta'; S.mapAll = false; S.day = num(id); S.region = null; S.pin = null; MV.fresh = true; render(); window.scrollTo(0, 0); },
  mapfocus:function(id){ var it = find('itinerary', id); if (!it) return; S.tab = 'peta'; S.mapAll = false; S.day = num(it.day); S.region = null; S.focus = id; MV.fresh = true; render(); window.scrollTo(0, 0); },
  pinitem:function(id){ S.pin = id; var p = MV.model && MV.model.pins.filter(function(q){ return q.items && q.items.some(function(it){ return it.item_id === id; }); })[0]; if (p) { showPin(p); var svg = $('map'); if (svg) { var cx = p.x, cy = p.y; MV.vb.x = cx - MV.vb.w / 2; MV.vb.y = cy - MV.vb.h / 2; schedule(); } var mw = document.querySelector('.mapwrap'); if (mw) mw.scrollIntoView({behavior:'smooth', block:'start'}); } },
  pinh:function(i){ var r = MV.model && MV.model.route; if (r && r.seq[i]) showHotel(r.seq[i].loc, null); },
  region:function(id){ S.tab = 'peta'; S.region = id || null; MV.fresh = true; render(); if (!id) return; },
  zin:function(){ var r = $('map').getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.6); },
  zout:function(){ var r = $('map').getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.6); },
  zfit:function(){ MV.vb = fitPoints(currentFitPoints(MV.model), $('map')); schedule(); },
  insgo:function(i){ var it = C.insights(DB(), todayISO())[Number(i)]; if (!it || !it.action) return; var a = it.action;
    if (a.tab === 'persiapan') { S.sub = a.sub || S.sub; }
    if (a.day) S.day = a.day;
    if (a.tab === 'peta') { S.mapAll = true; S.region = a.region || null; MV.fresh = true; }
    S.tab = a.tab; render();
    if (a.anchor) { var el = $(a.anchor); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); } else window.scrollTo(0, 0); },
  allins:function(){ S.allIns = !S.allIns; render(); if (!S.allIns) { var el = $('insight'); if (el) el.scrollIntoView({block:'start'}); } },
  reload:function(){ if (HAS_GAS) loadGAS(); },
  close:function(){ $('sheet').hidden = true; },
  goto:function(id){ var it = find('itinerary', id); if (it) { S.tab = 'jadwal'; S.day = num(it.day); render(); window.scrollTo(0, 0); } }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tab],[data-day],[data-act],[data-slice]');
  if (!el) { if (e.target.id === 'sheet') $('sheet').hidden = true; return; }
  if (el.hasAttribute('data-tab')) { go(el.getAttribute('data-tab')); return; }
  if (el.hasAttribute('data-day')) {
    var v = el.getAttribute('data-day');
    if (v === 'all') { S.mapAll = true; S.pin = null; S.region = null; }
    else { S.day = num(v); if (S.tab === 'peta') { S.mapAll = false; S.pin = null; S.region = null; } }
    MV.fresh = true; render(); window.scrollTo(0, 0); return;
  }
  if (el.hasAttribute('data-slice') && !el.hasAttribute('data-act')) {
    var w = el.closest('[data-donut]'), i = Number(el.getAttribute('data-slice'));
    hlSlice(w, el.classList.contains('on') ? -1 : i); return;
  }
  var a = el.getAttribute('data-act'); if (a === 'done' || a === 'othon') return;
  if (ACTIONS[a]) ACTIONS[a](el.getAttribute('data-id'));
});
document.addEventListener('pointerover', function(e){
  if (e.pointerType === 'touch') return;
  var el = e.target.closest && e.target.closest('[data-slice]'); if (el) hlSlice(el.closest('[data-donut]'), Number(el.getAttribute('data-slice')));
});
document.addEventListener('pointerout', function(e){
  if (e.pointerType === 'touch') return;
  var w = e.target.closest && e.target.closest('[data-donut]'); if (w && !(e.relatedTarget && w.contains(e.relatedTarget))) hlSlice(w, -1);
});
document.addEventListener('focusin', function(e){ var el = e.target.closest && e.target.closest('path[data-slice]'); if (el) hlSlice(el.closest('[data-donut]'), Number(el.getAttribute('data-slice'))); });
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'showOff') { S.showOff = el.checked; render(); return; }
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (a === 'done') save('itinerary', id, {done:el.checked}, el.checked ? 'Ditandai selesai' : 'Tanda selesai dihapus');
  if (a === 'othon') save('budget_other', id, {is_active:el.checked});
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') $('sheet').hidden = true; });
var rsz = 0; window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(function(){ if (S.tab === 'peta' && MV.vb) { var svg = $('map'); if (svg) { var r = svg.getBoundingClientRect(); MV.vb.h = MV.vb.w * r.height / (r.width || 1); schedule(); } } }, 150); });

if (BASE) initDay();
render();
if (HAS_GAS) loadGAS(); else $('view').innerHTML = '<p class="loading">Hubungkan app ke Google Sheet lewat layar setup.</p>';
window.__jp = {S:S, MV:MV, render:render, DB:DB, loadGAS:loadGAS};
if (HAS_GAS) {
  window.addEventListener('online', function(){ if (SYNC.state !== 'loading') loadGAS(); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || SYNC.state === 'loading') return;
    var age = SYNC.at ? Date.now() - new Date(SYNC.at).getTime() : Infinity;
    if (age > 5 * 60 * 1000 || SYNC.state !== 'ok' || Object.keys(OV.edits).length) loadGAS();
  });
}
})();

</script>
